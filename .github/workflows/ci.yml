# The checks the "Protect main" ruleset requires before a pull request can merge.
# Each job runs the root pnpm scripts a developer runs locally (see CONTRIBUTING.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint needs every commit in the pull request.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Installs the pnpm from packageManager and the Node.js from .nvmrc, then runs pnpm install.
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - run: pnpm lint

      - name: Check that the OpenAPI document and TypeScript types are up to date
        run: |
          pnpm generate:api
          git diff --exit-code -- backend/openapi.json web/src/lib/api-schema.gen.ts \
            || { echo "::error::Generated API files are out of date. Run 'pnpm generate:api' and commit the result."; exit 1; }

      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: >
          pnpm exec commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: pnpm/setup@v3
        with:
          install: false
      - run: pnpm test:backend

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm test:web
      - run: pnpm build:web

  # Builds the image that runs on staging and production once and runs the end-to-end tests
  # against it. On main, push-image pushes this same image.
  test-e2e:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      # Neither needs the image, so both run while it builds. Only these two services are pulled:
      # no registry has the image the app services use. The tests run headless, which only
      # needs Chromium's headless shell.
      - name: Start pulling the services and installing Chromium
        run: |
          (
            set +e
            docker compose --file compose.e2e.yaml pull --quiet postgres mailpit &&
              pnpm --filter @musialize/e2e exec playwright install --with-deps --only-shell chromium
            echo $? > "$RUNNER_TEMP/prepare.exit"
          ) > "$RUNNER_TEMP/prepare.log" 2>&1 &

      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: musialize:ci
          load: true
          cache-from: type=gha
          # Only main saves the cache, which takes up to a minute and a half. Pull requests read
          # the one main saved, so they get its dependency layers without writing their own.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}

      # Gives up after five minutes, and shows the log either way.
      - name: Wait for the services and Chromium
        run: |
          for _ in $(seq 300); do [ -s "$RUNNER_TEMP/prepare.exit" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/prepare.log"
          exit "$(cat "$RUNNER_TEMP/prepare.exit" 2>/dev/null || echo 1)"

      - run: pnpm test:e2e
        env:
          MUSIALIZE_IMAGE: musialize:ci
          APP_VERSION: ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7

      # Only push-image needs the tested image as a file, and it only runs on main.
      - name: Save the tested image for push-image
        if: github.event_name == 'push'
        run: docker save --output "$RUNNER_TEMP/image.tar" musialize:ci
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  # Ships every commit on main to staging (ADR-0004, ADR-0009): push the image test-e2e tested,
  # then migrate, deploy and wait until staging runs this commit (deploy.yml).
  push-image:
    if: github.event_name == 'push'
    needs: [lint, test-backend, test-web, test-e2e]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image
          path: ${{ runner.temp }}

      # The image test-e2e tested, not a rebuild, under an immutable tag only (never latest).
      - name: Push the tested image to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/fekko-dev/musialize:sha-${{ needs.test-e2e.outputs.version }}
        run: |
          docker load --input "$RUNNER_TEMP/image.tar"
          docker tag musialize:ci "$IMAGE"
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"

  # One deploy at a time comes from the workflow's concurrency: runs on main queue in commit
  # order, and a waiting older run is replaced by a newer one, so it never deploys after it.
  deploy-staging:
    needs: [test-e2e, push-image]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      tag: sha-${{ needs.test-e2e.outputs.version }}
      commit: ${{ needs.test-e2e.outputs.version }}
    secrets: inherit
