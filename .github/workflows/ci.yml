# The checks the "Protect main" ruleset requires before a pull request can merge.
# Each job runs the root pnpm scripts a developer runs locally (see CONTRIBUTING.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint needs every commit in the pull request.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Installs the pnpm from packageManager and the Node.js from .nvmrc, then runs pnpm install.
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - run: pnpm lint

      - name: Check that the OpenAPI document and TypeScript types are up to date
        run: |
          pnpm generate:api
          git diff --exit-code -- backend/openapi.json web/src/lib/api-schema.gen.ts \
            || { echo "::error::Generated API files are out of date. Run 'pnpm generate:api' and commit the result."; exit 1; }

      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: >
          pnpm exec commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: pnpm/setup@v3
        with:
          install: false
      - run: pnpm test:backend

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm test:web
      - run: pnpm build:web

  # Builds the image that runs on staging and production once; test-e2e tests this same image.
  image:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: musialize:ci
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  test-e2e:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - uses: actions/download-artifact@v8
        with:
          name: image
          path: ${{ runner.temp }}
      - run: docker load --input "$RUNNER_TEMP/image.tar"
      - run: pnpm --filter @musialize/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          MUSIALIZE_IMAGE: musialize:ci
          APP_VERSION: ${{ needs.image.outputs.version }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7
