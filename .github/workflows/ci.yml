# The checks the "Protect main" ruleset requires before a pull request can merge.
# Each job runs the root pnpm scripts a developer runs locally (see CONTRIBUTING.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint needs every commit in the pull request.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Installs the pnpm from packageManager and the Node.js from .nvmrc, then runs pnpm install.
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - run: pnpm lint

      - name: Check that the OpenAPI document and TypeScript types are up to date
        run: |
          pnpm generate:api
          git diff --exit-code -- backend/openapi.json web/src/lib/api-schema.gen.ts \
            || { echo "::error::Generated API files are out of date. Run 'pnpm generate:api' and commit the result."; exit 1; }

      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: >
          pnpm exec commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: pnpm/setup@v3
        with:
          install: false
      - run: pnpm test:backend

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm test:web
      - run: pnpm build:web

  # Builds the image that runs on staging and production once; test-e2e tests this same image.
  image:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: musialize:ci
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  test-e2e:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - uses: actions/download-artifact@v8
        with:
          name: image
          path: ${{ runner.temp }}
      - run: docker load --input "$RUNNER_TEMP/image.tar"
      - run: pnpm --filter @musialize/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          MUSIALIZE_IMAGE: musialize:ci
          APP_VERSION: ${{ needs.image.outputs.version }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7

  # Ships every commit on main to staging (ADR-0004, ADR-0009): push the image test-e2e tested,
  # migrate staging's database, deploy, and wait until staging runs this commit.
  deploy-staging:
    if: github.event_name == 'push'
    needs: [lint, test-backend, test-web, image, test-e2e]
    runs-on: ubuntu-latest
    environment: staging
    # One deploy at a time. Runs on main already queue in commit order (see the workflow's
    # concurrency), and a queued older deploy is replaced by a newer one, never run after it.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/fekko-dev/musialize
      VERSION: ${{ needs.image.outputs.version }}
      TAG: sha-${{ needs.image.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image
          path: ${{ runner.temp }}

      # The image test-e2e tested, not a rebuild, under an immutable tag only (never latest).
      - name: Push the tested image to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker load --input "$RUNNER_TEMP/image.tar"
          docker tag musialize:ci "$IMAGE:$TAG"
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$TAG"

      # The deploy user's key may only run deploy/musialize-migrate. Only the pinned host key is
      # trusted, so an unknown or changed key fails here. A failed migration fails the job here,
      # before anything is deployed. jq turns the bundle's JSON log into plain messages ("Applying
      # migration …" or "No migrations were applied …") and drops the SQL of successful commands.
      - name: Migrate staging's database
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        # pipefail, or jq's exit code would hide a failed migration.
        shell: bash
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          ssh -i "$RUNNER_TEMP/deploy_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            "deploy@$SSH_HOST" "staging $TAG" |
            jq --raw-input --raw-output '
              (try fromjson catch null) as $entry
              | if ($entry | type) != "object" then .
                elif $entry.EventId.Name == "Microsoft.EntityFrameworkCore.Database.Command.CommandExecuted" then empty
                else [$entry["@m"], $entry["@x"]] | map(select(.)) | join("\n") end'

      # application.update with only dockerImage changes the tag and keeps the registry login
      # stored with the image; saveDockerProvider would overwrite that login.
      - name: Deploy the image through the Dokploy API
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
        # No --show-error: curl's own messages name the host, and GitHub only masks the whole
        # DOKPLOY_URL. Dokploy's error body is shown instead.
        run: |
          dokploy() {
            local response
            response="$(curl --silent --fail-with-body \
              --header "x-api-key: $DOKPLOY_API_KEY" --json "$2" "${DOKPLOY_URL%/}/api/$1")" ||
              { echo "::error::Dokploy $1 failed (curl exit code $?): $response"; return 1; }
          }
          dokploy application.update "$(jq -n --arg id "$APPLICATION_ID" --arg image "$IMAGE:$TAG" \
            '{applicationId: $id, dockerImage: $image}')"
          dokploy application.deploy "$(jq -n --arg id "$APPLICATION_ID" --arg title "CI: $TAG" \
            '{applicationId: $id, title: $title}')"

      # Dokploy deploys in the background, and Swarm only switches over once the new version is
      # healthy, so staging runs this commit once /health reports it.
      - name: Wait until staging runs this commit
        timeout-minutes: 10
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          until health="$(curl --silent --max-time 10 "${APP_URL%/}/health")" &&
            [ "$(jq -r '"\(.status) \(.version)"' <<< "$health" 2>/dev/null)" = "healthy $VERSION" ]; do
            sleep 10
          done
          echo "$health"
