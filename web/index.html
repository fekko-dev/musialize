<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Replaced by the Group's name once /api/branding answers. -->
    <title>Musialize</title>
    <!-- Served by the backend from the deployment's branding folder (docs/deployment.md#branding). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/branding/favicon.ico" sizes="any" />
    <link rel="icon" href="/branding/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/branding/apple-touch-icon.png" />
    <!-- Theme before first paint, so dark mode doesn't flash white. Rules: theme-provider.tsx -->
    <script>
      try {
        const theme = localStorage.getItem("vite-ui-theme");
        if (
          theme === "dark" ||
          (theme !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
